pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    root /site;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    location = /health { access_log off; return 200 'ok'; }
    location = /robo { return 308 /robo/$is_args$args; }
    location = /robo/compare.html { return 308 /robo/$is_args$args; }
    location = /robo/ { try_files /robo/index.html =404; }
    location /robo/ { try_files $uri =404; }
    location / { return 404; }
  }
}
