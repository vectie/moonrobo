<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>E1 实机镜像 · MoonRobo</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="./e1/live-base.css"><link rel="stylesheet" href="./e1/live.css">
</head>
<body class="e1-page">
<header class="topbar"><a class="brand" href="./index.html">MoonRobo</a><nav aria-label="项目导航"><a href="./index.html">操作台</a><a href="./e1-live.html" aria-current="page">实机镜像</a></nav></header>
<main class="live-lab">
  <h1>实机与参考动作</h1>
  <p class="intro">左侧显示实机关节与 IMU，右侧可预览双肘 90° → 60° 交替击鼓。拖动任一模型可同时旋转视角。</p>
  <div class="pose-pair">
    <section><div class="pane-head"><h2>实机镜像</h2><span id="link-state" role="status" aria-atomic="true">等待遥测</span></div>
      <div class="viewport"><canvas id="measured" aria-label="E1 实测关节与 IMU 姿态" tabindex="0" hidden></canvas><p class="overlay" id="feed-note">等待 E1 的关节与 IMU 数据</p></div>
      <p class="caption">左肘实测 <strong id="measured-angle">—</strong> · 右肘实测 <strong id="measured-right-angle">—</strong><br>根部位置固定，朝向来自 IMU</p>
    </section>
    <section><div class="pane-head"><h2>动作预览</h2><select id="pose-source" aria-label="右侧姿态来源"><option value="raised" selected>双肘 90° ↔ 60°</option><option value="reference">左肘旧参考</option><option value="shadow" disabled>左肘影子记录</option></select></div>
      <div class="viewport"><canvas id="planned" aria-label="参考或影子输出的姿态预览" tabindex="0"></canvas></div>
      <p class="caption" id="reference-caption"><span id="reference-origin">以模型默认姿态为起点</span> · 其余关节保持起始角度<br>播放与拖动仅预览，不向机器人发送指令</p>
      <p class="caption" id="shadow-caption" hidden>策略给出的左肘位置 <strong id="shadow-angle">—</strong> · 同帧实测 <strong id="recorded-angle">—</strong> · 未发送</p>
    </section>
  </div>
  <p id="model-error" role="alert" hidden></p>
  <section class="transport" aria-labelledby="trace-heading">
    <div class="trace-head"><h2 id="trace-heading">双肘预览角度</h2><output id="delta" for="scrub">—</output></div>
    <p class="preview-phase" id="preview-phase">预览阶段：双肘抬至 90°</p>
    <div class="trace-legend"><span class="legend-left">左肘（实线）</span><span id="right-legend" class="legend-right">右肘（虚线）</span></div>
    <canvas id="trace" aria-label="双肘抬至 90 度，再交替下落 30 度的预览曲线"></canvas>
    <label class="sr" for="scrub">参考动作时间</label><input id="scrub" type="range" min="0" value="0" step="1">
    <div class="transport-actions"><button id="play" type="button">播放预览</button><button id="peak" type="button">双肘 90°</button><button id="left-drop" type="button">左肘 60°</button><button id="right-drop" type="button">右肘 60°</button><output id="clock" for="scrub"></output></div>
  </section>
</main><script type="module" src="./e1/live.js"></script>
</body></html>
